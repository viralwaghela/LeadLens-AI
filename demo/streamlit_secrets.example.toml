# ---------------------------------------------------------------------------
# Secrets for the PUBLIC DEMO Streamlit app ONLY.
#
# Paste this into: Streamlit Community Cloud -> your DEMO app -> Settings ->
# Secrets, then replace every PLACEHOLDER value. Never reuse a value from the
# production/client app. See docs/V2_DEMO_ENVIRONMENT.md for the full checklist.
#
# Streamlit exposes top-level secrets to the app as environment variables,
# so every value is a flat, quoted string.
#
# There is deliberately NO WhatsApp / Gmail / Google / MASTER_* / CLIENT*_ /
# LEADLENS_CREDENTIAL_ENCRYPTION_KEY / APP_PASSWORD entry: the demo has no
# real integrations, and the app refuses to start if any of those exist.
# ---------------------------------------------------------------------------

# Turns on every demo guard (read-only, no external actions, LLM limits, ...).
LEADLENS_DEMO_MODE = "1"

# Real per-user identity + tenant scoping (the demo relies on RBAC).
LEADLENS_V2_AUTH_ENABLED = "1"
LEADLENS_V2_TENANT_CONTEXT_ENABLED = "1"
LEADLENS_V2_CRM_TENANT_AUTHORITATIVE_ENABLED = "1"
LEADLENS_V2_JARVIS_MEMORY_TENANT_AUTHORITATIVE_ENABLED = "1"
LEADLENS_V2_ORG_SCOPED_SETTINGS_ENABLED = "1"

# Makes the demo organization the default, so no stray "default-clinic" is created.
LEADLENS_DEFAULT_ORG_SLUG = "leadlens-demo"

# The DEMO-ONLY PostgreSQL database (its own project/instance, not production).
# Use a PLAIN postgresql:// URL — no "+psycopg" suffix.
DATABASE_URL = "postgresql://user:password@PLACEHOLDER_HOST:5432/PLACEHOLDER_DB?sslmode=require"

# The DEMO-ONLY OpenAI key (its own OpenAI Project with a monthly budget cap).
OPENAI_API_KEY = "PLACEHOLDER-demo-only-openai-key"

# Cheapest suitable model + hard usage limits (calls, not questions: one question
# fans out into several calls). Tune to taste; the OpenAI Project budget is the backstop.
DEMO_OPENAI_MODEL = "gpt-5-mini"
DEMO_LLM_MAX_CALLS_PER_SESSION = "15"
DEMO_LLM_MAX_CALLS_PER_HOUR = "60"
DEMO_LLM_MAX_CALLS_PER_DAY = "300"
DEMO_LLM_MAX_OUTPUT_TOKENS = "1500"

# Signs the short-lived reload token that keeps a visitor signed in across the
# Core switch. Generate a fresh one:  python -c "import secrets; print(secrets.token_hex(32))"
LEADLENS_V2_AUTH_SESSION_SECRET = "PLACEHOLDER-generate-a-random-64-hex-string"
