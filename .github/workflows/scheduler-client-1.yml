name: Scheduler (client-1)

# Same purpose as scheduler-master.yml, but against the client-1 branch's
# deployment — a separate clinic, separate database, separate WhatsApp
# credentials. Kept as two independent workflow files rather than one
# parameterized workflow so each clinic's schedule/secrets can be changed
# or disabled without touching the other's.

on:
  schedule:
    - cron: "5 * * * *"  # every hour, offset 5 min from the master job
  workflow_dispatch: {}

jobs:
  run-scheduler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: client-1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scheduled checks
        env:
          DATABASE_URL: ${{ secrets.CLIENT1_DATABASE_URL }}
          WHATSAPP_ACCESS_TOKEN: ${{ secrets.CLIENT1_WHATSAPP_ACCESS_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.CLIENT1_WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_API_VERSION: ${{ secrets.CLIENT1_WHATSAPP_API_VERSION }}
        run: python scheduler/run_scheduled_checks.py
